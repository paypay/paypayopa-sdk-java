name: Publish package to the Maven Central Repository
on:
  release:
    types: [created]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Java
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      - name: Publish package
        run: |
          echo "signing.keyId=${SIGNING_KEY_ID}" >> gradle.properties
          echo "signing.password=${SIGNING_PASSWORD}" >> gradle.properties
          echo "signing.secretKeyRingFile=${SIGNING_SECRET_KEY_PATH}" >> gradle.properties
          ./gradlew -Prelease uploadArchives
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_SECRET_KEY_PATH: ${{ secrets.SIGNING_SECRET_KEY_PATH }}
      - name: Upload deployment to Central Portal (automatic)
        run: |
          AUTH_BEARER="$(printf '%s:%s' "$OSSRH_USERNAME" "$OSSRH_TOKEN" | base64 -w0)"
          curl -sSf -X POST \
            -H "Authorization: Bearer ${AUTH_BEARER}" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/jp.ne.paypay?publishing_type=automatic"
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}